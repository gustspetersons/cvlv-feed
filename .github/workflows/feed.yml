name: Update feed

on:
  schedule:
    # Every two hours at :17 (UTC); runs on the hour queue up on GitHub's side.
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      since:
        description: >-
          Optional backfill: also add fresh ads published since this Riga
          time (YYYY-MM-DD or YYYY-MM-DD HH:MM)
        required: false
        default: ""

permissions:
  contents: write
  actions: write  # for the keep-alive step

concurrency:
  group: feed
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: site

      - name: Build feed
        env:
          SINCE: ${{ inputs.since }}
        run: python3 feed.py --site site --since "$SINCE"

      - name: Publish
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Update feed"
            git push
          fi

      # GitHub turns schedules off in public repos after 60 days without
      # repository activity. Re-enabling the workflow resets that counter.
      - name: Keep the schedule alive
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh api --method PUT
          "repos/${{ github.repository }}/actions/workflows/feed.yml/enable"
